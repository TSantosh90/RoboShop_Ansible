- name: create ec2 and r53 records
  hosts: all
  connection: local
  vars:
    sg_id: sg-03397cf5cc6b4017f
    ami_id: ami-0220d79f3f480ecf5
    env: dev
    instances:
      - mongodb
      - catalogue
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      instance_id: "t3.micro"
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      name:  "{{ item }}-{{ env }}"
      tags:
        Project: Roboshop
        Component: "{{ item }}"
        Environment: "{{ env }}"
        Name: "{{ item }}-{{ env }}" 
    loop: "{{ instances }}"
    register: ec2_output

  - name: print the output
    ansible.builtin.debug:
     msg: "{{ ec2_output }}"

